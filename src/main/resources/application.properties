# Store the database in a file (./data/habits), so habits survive restarts.
spring.datasource.url=jdbc:h2:file:./data/habits
spring.datasource.username=sa
spring.datasource.password=

# Create/update the tables automatically from our Habit class.
spring.jpa.hibernate.ddl-auto=update

# Include our error messages in error responses so the page can show them.
server.error.include-message=always

# The port the server listens on (open http://localhost:8080).
server.port=8080
