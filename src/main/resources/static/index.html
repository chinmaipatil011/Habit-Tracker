<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>My habits</h1>
      <p id="today-text"></p>
    </header>

    <form id="add-form">
      <label for="habit-name" class="visually-hidden">New habit name</label>
      <input id="habit-name" type="text" maxlength="40" placeholder="e.g. Read 20 pages" autocomplete="off">
      <button type="submit">Add habit</button>
    </form>

    <p id="message" role="alert" hidden></p>

    <p class="hint">Tap a circle to tick or untick that day.</p>

    <section id="list" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
